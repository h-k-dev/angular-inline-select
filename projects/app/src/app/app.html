<mat-toolbar class="toolbar">
  <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle page navigation">
    <mat-icon>menu</mat-icon>
  </button>

  <angular-inline-text
    class="app-title"
    [isSingleLine]="true"
    [value]="title()"
    (savedModelChange)="title.set($event.value)"
    placeholder="Untitled"
    [normalizeValue]="true"
  />

  <div class="spacer"></div>

  <div class="toolbar-actions">
    <button mat-icon-button (click)="toggleTheme()" aria-label="Toggle theme">
      @if (theme() === 'dark') {
        <mat-icon>dark_mode</mat-icon>
      } @else {
        <mat-icon>light_mode</mat-icon>
      }
    </button>
    <button mat-flat-button (click)="openLoginDialog()">Sign In</button>
  </div>
</mat-toolbar>

<mat-sidenav-container class="shell">
  <mat-sidenav
    class="shell__nav"
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
    (openedChange)="sidenavOpened.set($event)"
  >
    <mat-nav-list aria-label="Sections">
      @for (sect of navSections; track sect.heading) {
        <h3 matSubheader>{{ sect.heading }}</h3>
        @for (item of sect.items; track item.link) {
          <a
            mat-list-item
            [routerLink]="item.link"
            routerLinkActive
            #rla="routerLinkActive"
            [activated]="rla.isActive"
            ariaCurrentWhenActive="page"
            (click)="handleSidenavNavigation()"
            >{{ item.label }}</a
          >
        }
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell__content">
    <!--
      The section's views (Playground / API / Theming) as tabbed navigation —
      its own strip so it never competes with the toolbar for width, and
      mat-tab-nav-bar paginates instead of bleeding when it overflows. Hidden
      for non-component sections (benchmark) that have no such views.
    -->
    @if (showSectionTabs()) {
      <nav
        mat-tab-nav-bar
        class="section-tabs"
        [tabPanel]="tabPanel"
        [mat-stretch-tabs]="false"
        aria-label="Section views"
      >
        <a
          mat-tab-link
          [routerLink]="['/', section()]"
          routerLinkActive
          #playgroundLink="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: true }"
          [active]="playgroundLink.isActive"
          ariaCurrentWhenActive="page"
          >Playground</a
        >
        <a
          mat-tab-link
          [routerLink]="['/', section(), 'api']"
          routerLinkActive
          #apiLink="routerLinkActive"
          [active]="apiLink.isActive"
          ariaCurrentWhenActive="page"
          >API</a
        >
        <a
          mat-tab-link
          [routerLink]="['/', section(), 'theming']"
          routerLinkActive
          #themingLink="routerLinkActive"
          [active]="themingLink.isActive"
          ariaCurrentWhenActive="page"
          >Theming</a
        >
      </nav>
    }

    <mat-tab-nav-panel #tabPanel class="section-panel">
      <router-outlet />
    </mat-tab-nav-panel>
  </mat-sidenav-content>
</mat-sidenav-container>
