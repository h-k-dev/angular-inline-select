<mat-toolbar class="toolbar">
  <angular-inline-text
    class="app-title"
    [isSingleLine]="true"
    [value]="title()"
    (savedModelChange)="title.set($event.value)"
    placeholder="Untitled"
    [normalizeValue]="true"
  />

  <nav class="toolbar-nav" aria-label="Pages">
    <a mat-button routerLink="/text" routerLinkActive="toolbar-nav__active" ariaCurrentWhenActive="page">Text</a>
    <a mat-button routerLink="/number" routerLinkActive="toolbar-nav__active" ariaCurrentWhenActive="page">Number</a>
    <a mat-button routerLink="/phone" routerLinkActive="toolbar-nav__active" ariaCurrentWhenActive="page">Phone</a>
    <a mat-button routerLink="/temporal" routerLinkActive="toolbar-nav__active" ariaCurrentWhenActive="page"
      >Temporal</a
    >
  </nav>

  <div class="spacer"></div>

  <div class="toolbar-actions">
    <button mat-icon-button (click)="toggleTheme()" aria-label="Toggle theme">
      @if (theme() === 'dark') {
        <mat-icon>dark_mode</mat-icon>
      } @else {
        <mat-icon>light_mode</mat-icon>
      }
    </button>
    <button mat-flat-button (click)="openLoginDialog()">Sign In</button>
  </div>
</mat-toolbar>

<router-outlet />
