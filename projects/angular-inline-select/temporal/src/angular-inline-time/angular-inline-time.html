<!-- Live interpretation preview: the localized reading of the draft. -->
<ng-template #previewTpl>{{ preview() }}</ng-template>

<!--
  The suffix slot: the +n day-overflow badge (group-fed, derived — never
  part of the draft), then the consumer's affix or the OS-picker 🕐.
-->
<ng-template #suffixTpl>
  @if (dayOffset() > 0) {
    <span class="time-day-badge" role="img" [attr.aria-label]="dayBadgeAria()"
      >+{{ dayOffset() }}</span
    >
  }
  @if (consumerSuffixTpl(); as consumer) {
    <ng-container [ngTemplateOutlet]="consumer" />
  } @else if (showNativePicker()) {
    <button
      type="button"
      class="time-trigger"
      aria-label="Open time picker"
      (mousedown)="$event.preventDefault()"
      (click)="openNativePicker($event)"
    >
      🕐
    </button>
  }
</ng-template>

<!--
  Composition, not inheritance: the inner text control owns the session
  machinery; this component translates 'HH:mm' ↔ typed drafts at the
  contract boundary. The native input below is the OS picker's anchor —
  focusable but invisible, never part of the draft.
-->
<angular-inline-text
  [value]="innerValue()"
  (valueChange)="handleInnerValue($event)"
  [(editing)]="editing"
  [isSingleLine]="true"
  [normalizeValue]="true"
  [errors]="innerErrors()"
  [invalid]="effectiveInvalid()"
  [disabled]="effectiveDisabled()"
  [readonly]="effectiveReadonly()"
  [required]="required()"
  [touched]="effectiveTouched()"
  [placeholder]="placeholder()"
  [ariaLabel]="ariaLabel()"
  [prefixTemplate]="prefixTpl()"
  [suffixTemplate]="suffixActive() ? suffixTpl : undefined"
  [hintTemplate]="preview() ? previewTpl : undefined"
  (touch)="touch.emit()"
  (saved)="handleInnerSaved($event)"
>
  <ng-content select="[editable-error]" ngProjectAs="[editable-error]" />
</angular-inline-text>

<input
  #nativeInput
  class="time-native"
  type="time"
  tabindex="-1"
  aria-hidden="true"
  [attr.step]="step()"
  [disabled]="effectiveDisabled() || effectiveReadonly()"
  (change)="handleNativePick($any($event.target).value)"
/>
