<!-- Live interpretation preview: what the draft means, on every keystroke. -->
<ng-template #previewTpl>{{ preview() }}</ng-template>

<!--
  Composition, not inheritance: the inner text control owns the session
  machinery; this component translates seconds ↔ clock strings at the
  contract boundary.
-->
<angular-inline-text
  [value]="innerValue()"
  (valueChange)="handleInnerValue($event)"
  [(editing)]="editing"
  [isSingleLine]="true"
  [normalizeValue]="true"
  [errors]="innerErrors()"
  [invalid]="invalid()"
  [disabled]="disabled()"
  [readonly]="readonly()"
  [required]="required()"
  [touched]="touched()"
  [placeholder]="placeholder()"
  [ariaLabel]="ariaLabel()"
  [prefixTemplate]="prefixTpl()"
  [suffixTemplate]="suffixTpl()"
  [hintTemplate]="preview() ? previewTpl : undefined"
  (touch)="touch.emit()"
  (saved)="handleInnerSaved($event)"
>
  <ng-content select="[editable-error]" ngProjectAs="[editable-error]" />
</angular-inline-text>
