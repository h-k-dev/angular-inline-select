<!--
  The input rehost: one real <input> — the family look is CSS. The panel
  carries the live reading and the error slot, appearing only when there
  is something to say.
-->
<span
  class="inline-duration"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  [class.inline-duration--invalid]="errorsVisible()"
>
  @if (prefixTpl(); as tpl) {
    <span class="inline-duration__affix" aria-hidden="true">
      <ng-container [ngTemplateOutlet]="tpl" />
    </span>
  }

  <input
    #durationInput
    class="inline-duration__input"
    [class.inline-duration__input--reverted]="revertFlash()"
    type="text"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
    inputmode="decimal"
    [attr.aria-label]="ariaLabel() ?? 'Duration'"
    [attr.aria-invalid]="ariaInvalid() || null"
    [attr.aria-required]="required() || null"
    [attr.size]="sizeOf()"
    [value]="draft()"
    [placeholder]="placeholder()"
    [disabled]="effectiveDisabled()"
    [readonly]="effectiveReadonly()"
    (input)="handleInput(durationInput.value)"
    (focusin)="handleFocusIn()"
    (focusout)="handleFocusOut()"
    (keydown)="handleKeydown($event)"
  />

  @if (suffixTpl(); as tpl) {
    <span class="inline-duration__affix" aria-hidden="true">
      <ng-container [ngTemplateOutlet]="tpl" />
    </span>
  }

  <!-- Snap-back is silent data-restoration — the announcement is not. -->
  <span class="inline-duration__sr" aria-live="polite">{{ revertNotice() }}</span>
</span>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="panelOpen()"
  [cdkConnectedOverlayPositions]="overlayPositions"
  (overlayOutsideClick)="dismissPanel()"
>
  <div #panel class="inline-duration__panel" (focusout)="handleFocusOut()">
    @if (preview(); as reading) {
      <div class="inline-duration__preview">{{ reading }}</div>
    }

    <div class="inline-duration__errors" [hidden]="!errorSlotVisible()">
      <ng-content select="[editable-error]" />
    </div>
  </div>
</ng-template>
