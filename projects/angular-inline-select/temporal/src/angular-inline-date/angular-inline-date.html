<!-- Live interpretation preview: the full reading of the draft. -->
<ng-template #previewTpl>{{ preview() }}</ng-template>

<!--
  Date slash-menu: /today, /tomorrow, /yesterday + the next seven weekdays.
  Labels come from Intl (localized, zero bundled translations); picking
  inserts the ISO date, which the codec reads and the preview interprets.
-->
<ng-template #dateMenu let-query let-apply="apply" let-activeId="activeId">
  <div role="listbox" aria-label="Dates">
    @for (command of commandOptions(query); track command.id) {
      <div
        role="option"
        [id]="command.id"
        [attr.data-active]="command.id === activeId()"
        [attr.aria-selected]="command.id === activeId()"
        (click)="apply(command.iso)"
      >
        <span class="date-command__label">{{ command.label }}</span>
        <span class="date-command__value">{{ command.iso }}</span>
      </div>
    } @empty {
      <div class="date-command__empty">—</div>
    }
  </div>
</ng-template>

<!--
  The suffix slot: the consumer's affix or the 📅 calendar trigger (the
  phone flag-picker analogue — a pointer affordance, never part of the
  draft).
-->
<ng-template #suffixTpl>
  @if (consumerSuffixTpl(); as consumer) {
    <ng-container [ngTemplateOutlet]="consumer" />
  } @else if (showCalendar()) {
    <button
      type="button"
      class="date-trigger"
      aria-label="Open calendar"
      [attr.aria-expanded]="calendarOpen()"
      (mousedown)="$event.preventDefault()"
      (click)="toggleCalendar($event)"
    >
      📅
    </button>
  }
</ng-template>

<!--
  Composition, not inheritance: the inner text control owns the session
  machinery; this component translates ISO dates ↔ typed drafts at the
  contract boundary.
-->
<angular-inline-text
  [value]="innerValue()"
  (valueChange)="handleInnerValue($event)"
  [(editing)]="editing"
  [isSingleLine]="true"
  [normalizeValue]="true"
  [errors]="innerErrors()"
  [invalid]="effectiveInvalid()"
  [disabled]="effectiveDisabled()"
  [readonly]="effectiveReadonly()"
  [required]="required()"
  [touched]="effectiveTouched()"
  [placeholder]="placeholder()"
  [ariaLabel]="ariaLabel()"
  [prefixTemplate]="prefixTpl()"
  [suffixTemplate]="suffixActive() ? suffixTpl : undefined"
  [hintTemplate]="preview() ? previewTpl : undefined"
  [menuTemplate]="showDateMenu() ? dateMenu : undefined"
  (touch)="touch.emit()"
  (saved)="handleInnerSaved($event)"
>
  <ng-content select="[editable-error]" ngProjectAs="[editable-error]" />
</angular-inline-text>

<!--
  T2 — the calendar overlay. Open-on-edit NEVER steals focus (the grid is
  a live mirror of the draft); ArrowDown hands focus over; Escape and
  picks refocus the field BEFORE the popup collapses.
-->
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="calendarOrigin()"
  [cdkConnectedOverlayOpen]="calendarOpen()"
  [cdkConnectedOverlayPositions]="calendarPositions"
  [cdkConnectedOverlayViewportMargin]="8"
  (overlayOutsideClick)="closeCalendar()"
  (detach)="closeCalendar()"
>
  <div class="date-calendar" role="dialog" aria-label="Calendar">
    <angular-inline-calendar
      [activeDay]="pendingDay()"
      [selectedDay]="internalRange().start"
      [locale]="locale()"
      [now]="now()"
      (picked)="pickDate($event)"
      (escaped)="escapeCalendar()"
    />
  </div>
</ng-template>
