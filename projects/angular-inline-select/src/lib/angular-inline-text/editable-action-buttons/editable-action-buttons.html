@if (!hideDiscard()) {
  <button
    mat-button
    type="button"
    class="action action-reset"
    (mousedown)="$event.preventDefault(); $event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
    (click)="decline.emit()"
    aria-label="Discard"
    [disabled]="disable()"
  >
    <mat-icon>history</mat-icon>
    Discard
  </button>
}

<button
  mat-flat-button
  type="button"
  class="action action-save"
  (mousedown)="$event.preventDefault(); $event.stopPropagation()"
  (keydown)="$event.stopPropagation()"
  (click)="accept.emit()"
  [disabled]="disableAccept() || disable()"
  aria-label="Save"
  [attr.aria-busy]="isLoading()"
>
  <mat-icon>
    @if (isLoading()) {
      sync
    } @else {
      save
    }
  </mat-icon>
  Save
</button>
